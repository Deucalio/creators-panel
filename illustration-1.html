<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PartnerLoop — Add Payout Details Card Redesigns</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f8f9fa;
      --surface: #ffffff;
      --surface-muted: #f3f4f6;
      --line: #e5e7eb;
      --line-soft: #f1f3f5;
      --ink: #111827;
      --ink-muted: #4b5563;
      --ink-subtle: #6b7280;
      --brand: #4f46e5;
      --brand-hover: #4338ca;
      --brand-ink: #ffffff;
      --brand-text: #4f46e5;
      --brand-surface: #eef2ff;
      --brand-line: #e0e7ff;
      --warn-surface: #fef3c7;
      --warn-ink: #92400e;
      --info-surface: #e0e7ff;
      --info-ink: #3730a3;
      --ok-surface: #d1fae5;
      --ok-ink: #065f46;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0e0f15;
      --surface: #171822;
      --surface-muted: #1f212e;
      --line: #2a2d3d;
      --line-soft: #232533;
      --ink: #f9fafb;
      --ink-muted: #9ca3af;
      --ink-subtle: #6b7280;
      --brand: #6366f1;
      --brand-hover: #818cf8;
      --brand-ink: #ffffff;
      --brand-text: #a5b4fc;
      --brand-surface: #1e1e38;
      --brand-line: #312e81;
      --warn-surface: #3a2a08;
      --warn-ink: #fcd34d;
      --info-surface: #1e1e3f;
      --info-ink: #a5b4fc;
      --ok-surface: #0b2f24;
      --ok-ink: #6ee7b7;
    }

    body {
      background-color: var(--canvas);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--line);
    }

    .action-pill {
      background-color: var(--warn-surface);
      color: var(--warn-ink);
      border: 1px solid color-mix(in srgb, var(--warn-ink) 22%, transparent);
    }

    .icon-btn {
      background-color: var(--surface-muted);
      color: var(--ink-muted);
    }
    .icon-btn:hover {
      color: var(--ink);
    }

    .primary-btn {
      background-color: var(--brand);
      color: var(--brand-ink);
    }
    .primary-btn:hover {
      background-color: var(--brand-hover);
    }

    .copy-chip {
      background-color: var(--surface-muted);
      color: var(--ink-muted);
      border: 1px solid var(--line);
    }
    .copy-chip:hover {
      background-color: var(--brand-surface);
      color: var(--brand-text);
      border-color: var(--brand-line);
    }
  </style>
</head>
<body class="min-h-screen p-6 md:p-10">

  <div class="max-w-6xl mx-auto space-y-8">

    <!-- Top Bar -->
    <div class="card rounded-xl px-5 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="w-2.5 h-2.5 rounded-full" style="background-color: var(--warn-ink);"></span>
        <h1 class="text-sm font-bold">PartnerLoop — "Add your payout details" Illustrated Variations</h1>
      </div>
      <button
        onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'"
        class="primary-btn px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer transition"
      >
        Toggle Light / Dark Theme
      </button>
    </div>

    <!-- 3-Column Comparison Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-stretch">



      <!-- ========================================================
           OPTION 2: SIDE-BY-SIDE SPOT ILLUSTRATION (Wallet & Card)
           ======================================================== -->
      <div class="flex flex-col space-y-2">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs font-bold uppercase tracking-wider" style="color: var(--ink-subtle);">Option 2: Side-by-Side Wallet</span>
          <button onclick="copySvg('svg-wallet-spot', this)" class="copy-chip px-2.5 py-1 rounded-md text-xs font-medium cursor-pointer">Copy SVG</button>
        </div>

        <div class="card rounded-2xl p-6 flex flex-col justify-between flex-1 space-y-5 shadow-xs">
          <div class="space-y-4">
            <!-- Header Row -->
            <div class="flex items-center justify-between">
              <span class="action-pill inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold">
                <span class="w-2 h-2 rounded-full" style="background-color: var(--warn-ink);"></span>
                Action needed
              </span>
              <button class="icon-btn w-9 h-9 rounded-xl flex items-center justify-center cursor-pointer transition" aria-label="Payout settings">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </button>
            </div>

            <!-- Content + Right Spot Illustration -->
            <div class="flex items-center justify-between gap-4 pt-1">
              <div class="space-y-2">
                <h3 class="text-lg font-bold tracking-tight">Add your payout details</h3>
                <p class="text-sm leading-relaxed" style="color: var(--ink-muted);">
                  You've earned commissions, but haven't saved payout details yet. Add your Easypaisa, JazzCash or bank details so Quickstart (65d173cf) can pay you.
                </p>
              </div>

              <!-- ILLUSTRATION 2: Open Wallet + Bank Card + Floating Coin -->
              <div id="svg-wallet-spot" class="shrink-0">
                <svg viewBox="0 0 115 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-24 w-auto select-none" aria-hidden="true">
                  <!-- Soft Background Halo -->
                  <circle cx="58" cy="56" r="36" fill="var(--warn-surface, #fef3c7)" fill-opacity="0.55" />
                  <!-- Ground Line -->
                  <line x1="16" y1="88" x2="98" y2="88" stroke="var(--ink, #111827)" stroke-width="1.75" stroke-linecap="round" />

                  <!-- Bank Card Sliding Into Wallet (Tilted) -->
                  <g transform="translate(28, 22) rotate(-14)">
                    <rect x="0" y="0" width="48" height="32" rx="4" fill="var(--info-surface, #e0e7ff)" stroke="var(--ink, #111827)" stroke-width="1.75" />
                    <rect x="0" y="7" width="48" height="6" fill="var(--brand, #4f46e5)" />
                    <line x1="7" y1="21" x2="22" y2="21" stroke="var(--ink, #111827)" stroke-width="1.5" stroke-linecap="round" />
                  </g>

                  <!-- Crisp Green Banknote Peeking Out -->
                  <path d="M52,34 L82,26 L86,46 L54,48 Z" fill="var(--ok-surface, #d1fae5)" stroke="var(--ink, #111827)" stroke-width="1.75" stroke-linejoin="round" />
                  <circle cx="69" cy="37" r="4" fill="var(--surface, #ffffff)" stroke="var(--ok-ink, #065f46)" stroke-width="1.5" />

                  <!-- Main Pocket Wallet Body -->
                  <rect x="22" y="42" width="66" height="46" rx="8" fill="var(--surface, #ffffff)" stroke="var(--ink, #111827)" stroke-width="2" />
                  <!-- Warm Leather Tint Overlay -->
                  <rect x="22" y="42" width="66" height="46" rx="8" fill="var(--warn-surface, #fef3c7)" fill-opacity="0.45" stroke="var(--ink, #111827)" stroke-width="2" />
                  <!-- Stitching Detail -->
                  <line x1="28" y1="48" x2="78" y2="48" stroke="var(--warn-ink, #92400e)" stroke-width="1.25" stroke-dasharray="3 3" stroke-linecap="round" />
                  <!-- Wallet Clasp Strap -->
                  <path d="M70,58 L92,58 C94,58 95,60 95,62 L95,68 C95,70 94,72 92,72 L70,72 C66,72 64,69 64,65 C64,61 66,58 70,58 Z" fill="var(--surface, #ffffff)" stroke="var(--ink, #111827)" stroke-width="1.85" />
                  <circle cx="71" cy="65" r="2.5" fill="var(--brand, #4f46e5)" stroke="var(--ink, #111827)" stroke-width="1.25" />

                  <!-- Floating Action "+" Coin (Top Right) -->
                  <circle cx="88" cy="20" r="11" fill="var(--brand, #4f46e5)" stroke="var(--ink, #111827)" stroke-width="1.75" />
                  <line x1="88" y1="15.5" x2="88" y2="24.5" stroke="var(--brand-ink, #ffffff)" stroke-width="2" stroke-linecap="round" />
                  <line x1="83.5" y1="20" x2="92.5" y2="20" stroke="var(--brand-ink, #ffffff)" stroke-width="2" stroke-linecap="round" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Divider & CTA -->
          <div class="space-y-4 pt-1">
            <div class="border-t" style="border-color: var(--line-soft);"></div>
            <button class="primary-btn w-full py-3 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer transition">
              <span>Add payout details</span>
              <span class="text-base leading-none">›</span>
            </button>
          </div>
        </div>
      </div>

     
    </div>
  </div>

  <script>

    function copySvg(id, btn) {
      const svg = document.getElementById(id).innerHTML.trim();
      navigator.clipboard.writeText(svg).then(() => {
        const old = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = old), 1400);
      });
    }
  </script>
</body>
</html>
